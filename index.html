<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gimnasio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap"
      rel="stylesheet"
    />
    <link href="src/interface/style.css" rel="stylesheet" />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <h1>Gimnasio</h1>
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="btn-tab-home"
              data-bs-toggle="tab"
              data-bs-target="#home-container"
              type="button"
              role="tab"
            >
              Inicio
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="btn-tab-new"
              data-bs-toggle="tab"
              data-bs-target="#new-container"
              type="button"
              role="tab"
            >
              Nuevo socio
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="btn-tab-members"
              data-bs-toggle="tab"
              data-bs-target="#members-container"
              type="button"
              role="tab"
            >
              Socios
              <span class="badge rounded-pill" id="members-count">0</span>
            </button>
          </li>
        </ul>
      </div>
    </header>

    <main class="container">
      <div class="tab-content">
        <section
          class="tab-pane fade show active"
          id="home-container"
          role="tabpanel"
        >
          <div class="stats">
            <div class="stat">
              <label class="form-label" for="inp-total-members"
                >Cantidad de socios</label
              >
              <input
                class="form-control-plaintext"
                id="inp-total-members"
                type="text"
                value="0"
                readonly
              />
            </div>
            <div class="stat">
              <label class="form-label" for="inp-total-fees"
                >Total de cuotas</label
              >
              <input
                class="form-control-plaintext"
                id="inp-total-fees"
                type="text"
                value="0"
                readonly
              />
            </div>
          </div>
        </section>

        <section class="tab-pane fade" id="members-container" role="tabpanel">
          <p class="py-5 text-center text-secondary" id="members-empty-msg">
            No hay socios
          </p>
          <div class="row row-cols-1 row-cols-md-2 g-3" id="members-list"></div>
        </section>

        <section class="tab-pane fade" id="new-container" role="tabpanel">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="inp-name">Nombre</label>
              <input class="form-control" id="inp-name" type="text" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inp-discount">Descuento</label>
              <input class="form-control" id="inp-discount" type="number" min="0" max="100" placeholder="0" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inp-document">Documento</label>
              <button
                class="hint"
                type="button"
                data-bs-toggle="tooltip"
                title="Solo dígitos, sin puntos ni guiones."
              >
                ?
              </button>
              <input class="form-control" id="inp-document" type="text" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="sel-plan">Plan</label>
              <select class="form-select" id="sel-plan">
                <option value="basic">Básico</option>
                <option value="full">Completo</option>
                <option value="premium">Premium</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inp-fee">Cuota mensual</label>
              <input class="form-control" id="inp-fee" type="number" min="0" />
            </div>
          </div>
          <button class="btn btn-primary mt-4" id="btn-add" type="button">
            Agregar
          </button>
          <div class="mt-3 d-none" id="error-container">
            <p class="text-danger" id="error-msg"></p>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .querySelectorAll('[data-bs-toggle="tooltip"]')
        .forEach((element) => new bootstrap.Tooltip(element));
    </script>
    <script src="src/interface/main.ts" type="module"></script>
  </body>
</html>
